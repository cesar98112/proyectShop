
<div class="loginContainer">
    <h2>CREATE ACOUNT</h2>
    <div class="loginForm">
        <form action="">
            <div class="inputText">
                <label for="username">Username</label>
                <input type="text" [(ngModel)]="username" name="username" placeholder="username" id="password">
            </div>
            <div class="inputText">
                <label for="email">Email</label>
                <input type="text" name="email" placeholder="email" id="email">
            </div>
            <div class="inputText">
                <label for="password">Password</label>
                <input type="password" [(ngModel)]="password" name="password" placeholder="password" id="password">
            </div>
            <div class="inputText">
                <label for="password">RepeatPassword</label>
                <input type="password" [(ngModel)]="repeatPassword" name="RepeatPassword" placeholder="Repeat Password" id="password">
            </div>
            <div class="buttonLogin">
                <button (click)="addUser()">Register</button>
            </div>
            <p>¿Ya tienes cuenta?<a href="">autenticate</a></p>
            
        </form>
    </div>
    
</div>
