spring.application.name=gateway
spring.cloud.gateway.discovery.locator.enabled=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
spring.cloud.loadbalancer.ribbon.enabled=false

spring.cloud.gateway.routes[0].id=product
spring.cloud.gateway.routes[0].uri=lb://PRODUCT
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product/**

spring.cloud.gateway.routes[1].id=order
spring.cloud.gateway.routes[1].uri=lb://ORDER
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/order/**, /api/test/**

spring.cloud.gateway.routes[2].id=auth
spring.cloud.gateway.routes[2].uri=lb://AUTHENTICATION
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/autent/** ,/api/hello/**
spring.security.user.enabled=false

